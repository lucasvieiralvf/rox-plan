<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page with CSS Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bg-dark text-white text-center py-3">
        <h1 class="mb-0">Gerador de Grupos</h1>
    </header>
    <main class="container my-4">
        <div class="card p-4 shadow-sm">
            <div class="row g-3 mb-3">
                <div class="col-12 d-grid gap-2 d-md-block">
                    <button id="openAddPersonModalBtn" class="btn btn-primary">Adicionar/Selecionar Pessoa</button>
                    <button id="downloadTemplateBtn" class="btn btn-secondary">Baixar Template</n>
                </div>
            </div>

            <h2 id="currentGroupTitle" class="text-center mb-3">Pessoas Adicionadas: (0 de 5)</h2>
            <ul id="peopleList" class="list-group mb-3"></ul>

            <div class="text-center mb-4">
                <button id="generateGroupsBtn" class="btn btn-success btn-lg">Gerar Grupos</button>
            </div>

            <div id="groupsContainer" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 mb-4"></div>

            
        </div>

        <!-- Add Person Modal -->
        <div class="modal fade" id="addPersonModal" tabindex="-1" aria-labelledby="addPersonModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addPersonModalLabel">Adicionar Pessoa</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="toggleNewPerson" checked>
                            <label class="form-check-label" for="toggleNewPerson">Adicionar Nova Pessoa</label>
                        </div>

                        <div id="predefinedUserFields" class="mb-3" style="display: none;">
                            
                            <div class="mb-3">
                                <label for="predefinedClassFilter" class="form-label">Filtrar por Classe:</label>
                                <select class="form-select" id="predefinedClassFilter">
                                    <option value="">-- Todas as Classes --</option>
                                </select>
                            </div>
                            <label for="predefinedUserSelect" class="form-label">Selecione um usuário pré-definido:</label>
                            <select class="form-select" id="predefinedUserSelect">
                                <option value="">-- Selecione --</option>
                            </select>
                        </div>

                        <div id="newPersonFields">
                            <div class="mb-3">
                                <label for="modalNameInput" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="modalNameInput" placeholder="Digite um nome">
                            </div>
                            <div class="mb-3">
                                <label for="modalClassInput" class="form-label">Classe</label>
                                <select class="form-select" id="modalClassInput">
                                    <option value="">-- Selecione a Classe --</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="modalLevelInput" class="form-label">Nível</label>
                                <input type="number" class="form-control" id="modalLevelInput" placeholder="Nível (obrigatório)" min="1" step="1" max="200">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" id="addPersonModalBtn">Adicionar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4">
            <button id="downloadXlsxBtn" class="btn btn-outline-success">Baixar XLSX</button>
        </div>
    </main>
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2025 Gerador de Grupos</p>
    </footer>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
